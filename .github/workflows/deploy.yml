name: Careero CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careero-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Careero
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Careero/package-lock.json
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v6
        with:
          name: production-dist
          path: Careero/dist
          retention-days: 7

  deploy-production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: Careero
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Require Vercel deployment secrets
        shell: bash
        run: |
          missing=()
          [[ -z "$VERCEL_TOKEN" ]] && missing+=("VERCEL_TOKEN")
          [[ -z "$VERCEL_ORG_ID" ]] && missing+=("VERCEL_ORG_ID")
          [[ -z "$VERCEL_PROJECT_ID" ]] && missing+=("VERCEL_PROJECT_ID")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing GitHub Actions secrets: ${missing[*]}. Add them under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Careero/package-lock.json
      - run: npm ci
      - run: npx --yes vercel@56.3.2 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@56.3.2 build --prod --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@56.3.2 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
